name: Hydrotech CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate Vercel config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Smoke test production output
        run: |
          test -s package-lock.json
          test -s public/favicon.ico
          test -s public/assets/brand/logo-hydrotech.svg
          test -s public/assets/images/hero-installation.webp
          test -s dist/index.html
          test -s dist/de/index.html
          test -s dist/contatti/index.html
          test -s dist/de/kontakt/index.html
          test -s dist/grazie/index.html
          test -s dist/de/danke/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/favicon.ico
          test -s dist/assets/brand/logo-hydrotech.svg
          test -s dist/assets/images/hero-installation.webp
          grep -q 'Via Vallemaggia 54' dist/contatti/index.html
          grep -q '13:30' dist/contatti/index.html
          grep -q 'Richiedi informazioni' dist/index.html
          grep -q 'noindex,nofollow' dist/grazie/index.html
          grep -q 'hreflang="de"' dist/sitemap.xml
          if grep -R -q 'Richiedi preventivo' dist --include='*.html'; then
            echo 'Found stale CTA copy'
            exit 1
          fi
          if grep -q 'sync-assets' package.json; then
            echo 'Build still depends on remote asset bootstrap'
            exit 1
          fi
